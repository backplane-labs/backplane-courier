# Yarn 4. node_modules (not Plug'n'Play): vite and module federation run from node_modules/.bin.
nodeLinker: node-modules
enableTelemetry: false
# Yarn defaults stay on: no install scripts, no git dependencies, a version must be a day old.
# Our own scopes are released and consumed at once, so they skip the age gate.
npmPreapprovedPackages:
  - "@backplane-labs/*"
  - "@gopherex/*"
# @backplane-labs and @gopherex live in GitHub Packages; the token is in the user's ~/.yarnrc.yml
# (CI: yarn config set --home npmScopes.<scope>.npmAuthToken "$NODE_AUTH_TOKEN").
npmScopes:
  backplane-labs:
    npmRegistryServer: https://npm.pkg.github.com
  gopherex:
    npmRegistryServer: https://npm.pkg.github.com
