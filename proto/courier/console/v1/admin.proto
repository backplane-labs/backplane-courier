syntax = "proto3";

package courier.console.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/backplane-labs/backplane-courier/proto/courier/console/v1;courierconsolev1";

// AdminService is courier's internal API: what its console module shows
// and does, relayed by backplane behind the operator's session.
service AdminService {
  // The configured channels; secrets never included.
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  // Checks a channel against its provider without delivering: SMTP
  // connect and authenticate, an FCM validate-only message, a plugin's
  // Check.
  rpc CheckChannel(CheckChannelRequest) returns (CheckChannelResponse);
  // A fresh VAPID key pair for a webpush channel's configuration; courier
  // keeps nothing.
  rpc GenerateWebPushKeys(GenerateWebPushKeysRequest) returns (GenerateWebPushKeysResponse);
  // Sends a Web Push through a webpush channel to a subscription pasted
  // from a browser; an audit record like any delivery.
  rpc TestWebPush(TestWebPushRequest) returns (TestWebPushResponse);
}

message ListChannelsRequest {}

message ListChannelsResponse {
  repeated Channel channels = 1;
  // Whether deliveries are only recorded (live dry_run).
  bool dry_run = 2;
}

// Channel is one configured channel as the console shows it.
message Channel {
  string name = 1;
  // mail, push, webpush, or a plugin's kind.
  string kind = 2;
  // The plugin serving it; empty for a built-in kind.
  string plugin = 3;
  // The activity that delivers through it.
  string activity = 4;
  // Non-secret details: host and port, project, a plugin's settings.
  map<string, string> details = 5;
  int32 pool = 6;
  int32 rate_per_minute = 7;
  google.protobuf.Duration timeout = 8;
  // The channel its kind's activities use when a message names none.
  bool default = 9;
  // A plugin channel's state: empty while the plugin is reachable,
  // serving and describing the contract courier started with; else why
  // not (courier is not ready meanwhile).
  string problem = 10;
}

message CheckChannelRequest {
  string name = 1;
}

message CheckChannelResponse {
  bool ok = 1;
  string error = 2;
  google.protobuf.Duration took = 3;
}

message GenerateWebPushKeysRequest {}

message GenerateWebPushKeysResponse {
  // base64url: public_key goes to the channel and to browsers,
  // private_key to the channel's secret.
  string public_key = 1;
  string private_key = 2;
}

message TestWebPushRequest {
  string channel = 1;
  // PushSubscription.toJSON() of a browser: {"endpoint", "keys": {"p256dh", "auth"}}.
  string subscription = 2;
  // JSON the service worker gets.
  string payload = 3;
}

message TestWebPushResponse {
  bool ok = 1;
  string error = 2;
  // The push service's code of a refusal: gone, unauthorized, too_big...
  string code = 3;
  // The push service's id of the message.
  string id = 4;
  google.protobuf.Duration took = 5;
}
